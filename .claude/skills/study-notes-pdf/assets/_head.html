<!doctype html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{SHORT_TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --ink:#1d2433; --soft:#5a6474; --rule:#d5dae2; --paper:#fff;
  --accent:#1f5f8b; --accent2:#7a3e65; --tint:#f3f6fa;
  /* Solid highlighter colours. Never use rgba/opacity/gradients here:
     Chrome exports those as PDF soft masks/patterns that some viewers
     drop when zooming, so highlights "disappear". */
  --hy:#ffe680; --hg:#bdf0cc; --hp:#ffc9db; --hb:#cfe6ff;
}
*{box-sizing:border-box}
html{background:#e9ecf1}
body{margin:0;font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;color:var(--ink);font-size:15.5px;line-height:1.75;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{max-width:210mm;margin:24px auto 60px;background:var(--paper);padding:14mm 13mm;box-shadow:0 1px 3px #c8ced8,0 10px 30px #d9dde4}
p{margin:.25em 0 .5em}
ul,ol{margin:.2em 0 .45em;padding-inline-start:1.25em;padding-inline-end:0}
li{margin:.12em 0}
li::marker{color:var(--accent)}
b{font-weight:700}
.small{font-size:.9em}
.lead{color:var(--soft);margin:.1em 0 .6em}

mark{color:inherit;background:var(--hy);padding:0 .2em;border-radius:.3em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
mark.g{background:var(--hg)} mark.p{background:var(--hp)} mark.b{background:var(--hb)}

/* title block */
.title{border:2px solid var(--ink);border-radius:14px;padding:16px 20px;margin-bottom:12px}
.title .k{color:var(--soft);font-size:14px}
.title h1{font-size:30px;line-height:1.35;margin:4px 0 2px}
.title .sub{font-size:17px;color:var(--accent);font-weight:600}
.title .note{margin-top:8px;font-size:14px;color:var(--soft)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;margin-top:8px}

.toc{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:10px 0 4px}
.toc a{display:block;text-decoration:none;color:inherit;border:1.5px solid var(--rule);border-radius:10px;padding:8px 12px}
.toc a b{color:var(--accent)}
.toc a span{display:block;font-size:13.5px;color:var(--soft)}

/* lessons: each one starts on a new page */
.lesson{break-before:page}
.toc + .lesson{break-before:auto;margin-top:16px}  /* first lesson continues under the TOC */
h2{display:flex;align-items:center;gap:10px;font-size:24px;line-height:1.4;margin:0 0 10px;padding:8px 14px;background:var(--ink);color:#fff;border-radius:12px}
h2 .num{display:inline-grid;place-items:center;min-width:34px;height:34px;border-radius:50%;background:#fff;color:var(--ink);font-size:18px}
h3{font-size:19px;color:var(--accent);margin:16px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--rule);break-after:avoid}
h4{font-size:16px;margin:0 0 4px;color:var(--accent2)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;align-items:start}
.card{border:1.5px solid var(--rule);border-radius:12px;padding:10px 14px;background:#fff;margin-bottom:10px}
.grid > .card{margin-bottom:0}
.card.intro{background:var(--tint);border-color:transparent}
.card.vs{border-color:var(--hp);border-width:2px}
.card.qa{border-color:var(--hb);border-width:2px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.cols > div + div,.cols3 > div + div{border-inline-start:1.5px dashed var(--rule);padding-inline-start:12px}
.def{background:var(--tint);border-radius:9px;padding:7px 12px;margin:6px 0 8px}
.vsline{background:#fff4f8;border-radius:9px;padding:7px 12px;margin:6px 0 8px}
.q{font-weight:700;color:var(--accent)} .a{margin:.1em 0 .5em}
ol.tight,ul.tight{margin:.1em 0 .35em} ol.tight li,ul.tight li{margin:.05em 0}
table.t{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0}
table.t th{background:var(--ink);color:#fff;text-align:start;padding:6px 8px;font-weight:600}
table.t td{border-bottom:1.3px solid var(--rule);padding:6px 8px;vertical-align:top}
table.t tr{break-inside:avoid}
table.t.small{font-size:13px}
.ab{display:inline-block;font-size:11.5px;font-weight:700;border:1.3px solid var(--ink);border-radius:999px;padding:0 6px;direction:ltr;margin-top:2px}
.def p,.card p{margin:.2em 0 .35em}

/* page-break hygiene: no orphaned headings, no label ending a page */
li,.def,.vsline,.qa{break-inside:avoid}
h4{break-after:avoid}
.card > h4 + *{break-before:avoid}
.card{orphans:3;widows:3}
.card p:has(+ ul),.card p:has(+ ol),.card p:has(+ .def){break-after:avoid}
.card p + ul,.card p + ol{break-before:avoid}
.card > h4:first-child{margin-top:0}

@media (max-width:760px){
  .page{margin:0;padding:16px}
  .grid,.cols,.cols3,.toc{grid-template-columns:1fr}
  .cols > div + div,.cols3 > div + div{border-inline-start:none;padding-inline-start:0;border-top:1.5px dashed var(--rule);padding-top:8px}
}
@page{size:A4;margin:12mm 11mm 14mm 11mm}
@media print{
  html{background:#fff}
  body{font-size:10.6pt;line-height:1.65}
  .page{max-width:none;margin:0;padding:0;box-shadow:none}
  h2{font-size:17pt} h3{font-size:13.5pt}
  table.t{font-size:9.6pt} table.t.small{font-size:9pt}
}
</style>
</head>
<body>
<main class="page">
<header class="title">
  <div class="k">{{KICKER}}</div>
  <h1>{{TITLE}}</h1>
  <div class="sub">{{SUBTITLE}}</div>
  <div class="note">{{NOTE}}</div>
  <div class="legend">{{LEGEND}}</div>
</header>
<nav class="toc">
{{TOC}}
</nav>
